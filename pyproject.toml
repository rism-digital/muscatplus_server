[project]
name = "search_server"
description = "MuscatPlus Search Server"
license = "MIT"
version = "v1.0.5"
authors = [{name = "Andrew Hankinson", email = "andrew.hankinson@rism.digital"}]
requires-python = '>=3.11,<4.0'
dependencies = ['pyyaml (>=6.0.1,<7.0.0)',
    'rdflib (>=7.0.0,<8.0.0)',
    'Jinja2 (>=3.1.2,<4.0.0)',
    'orjson (>=3.9.15,<4.0.0)',
    'verovio (>=5.1.0,<6.0.0)',
    'small-asc @ git+https://github.com/rism-digital/small-asc.git@main',
    'ypres @ git+https://github.com/rism-digital/ypres.git@main',
    'sanic (>=24.0.0,<25.0.0)',
    'sentry-sdk[sanic] (>=2.19.0,<3.0.0)',
    "httpx (>=0.28.1,<0.29.0)"]

[tool.poetry]
package-mode = false
requires-poetry = '>=2.0,<3.0'

[tool.poetry.dependencies.verovio]
allow-prereleases = true

[tool.poetry.group.dev.dependencies]
deptry = "^0.23.0"
ipython = "^9.0.0"
pytest = "^8.0.0"
pytest-cov = "^6.0.0"
aiofiles = "^24.0.0"
mypy = "^1.15.0"

[build-system]
requires = ['poetry-core (>=2.0,<3.0)']
build-backend = "poetry.masonry.api"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[[tool.poetry.source]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
priority = "supplemental"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # pycodestyle warnings
    "W",
    # Pyflakes
    "F",
    # pyupgrade
    ## Flake8 plugins
    "UP",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C",
    # flake8-django
    "DJ",
    # flake8-bandit
    "S",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = [
    # Ignore Pycodestyle line-length warnings, (mainly long comments).
    "E501",
    # Ignore McCabe complexity (for now).
    "C901",
]
